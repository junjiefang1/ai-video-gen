server {
    listen 80;
    server_name _;

    root /var/www/ai-video-gen;
    index index.html;

    # ffmpeg.wasm 需要这些头才能使用 SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # 反向代理 DashScope API（阿里云百炼）
    location /dashscope/ {
        proxy_pass https://dashscope-intl.aliyuncs.com/;
        proxy_set_header Host dashscope-intl.aliyuncs.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;

        # 视频生成任务可能耗时较长
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 静态文件缓存策略
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # ffmpeg WASM 文件（较大，需要正确 MIME 类型）
    location /ffmpeg/ {
        types {
            application/javascript js;
            application/wasm wasm;
        }
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1024;

    client_max_body_size 50m;
}
